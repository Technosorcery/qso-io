name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test all targets
        run: cargo test --all-targets --locked
      - name: Test documentation
        run: cargo test --doc --locked

  quality:
    name: Documentation and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check release metadata handling
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Check formatting
        run: cargo fmt --check
      - name: Check Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --no-deps --locked
      - name: List package contents
        run: cargo package --list --locked
      - name: Verify publication without uploading
        run: cargo publish --dry-run --locked
      - name: Build and test the distributable
        run: |
          cargo package --locked
          package_check_dir=$(mktemp -d)
          tar -xzf target/package/qso-io-*.crate -C "$package_check_dir"
          cargo test --all-targets --locked --manifest-path "$package_check_dir"/qso-io-*/Cargo.toml
          cargo test --doc --locked --manifest-path "$package_check_dir"/qso-io-*/Cargo.toml

  release-metadata:
    name: Classify release update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Technosorcery/qso-io'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.metadata.outputs.eligible }}
      release_pr: ${{ steps.metadata.outputs.release_pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Identify release authorization
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_metadata.py update "$GITHUB_EVENT_PATH"

  prepare-release:
    name: Prepare release PR
    needs: [release-metadata, publish-release]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && github.repository == 'Technosorcery/qso-io'
          && needs.release-metadata.result == 'success'
          && (needs.release-metadata.outputs.eligible == 'false'
              || needs.publish-release.result == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Attach preparation branch at the triggering revision
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: git switch --force-create main "$RELEASE_REVISION"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: release-plz@0.4.3,cargo-semver-checks@0.51.0
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Technosorcery
          repositories: qso-io
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: release-plz release-pr --git-token "$GH_TOKEN"

  publish-release:
    name: Publish release
    needs: [test, quality, release-metadata]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository == 'Technosorcery/qso-io'
      && needs.release-metadata.outputs.eligible == 'true'
      && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Read checked release version and reviewed notes
        id: package
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          test -z "$(git status --porcelain)"
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -er '.packages[] | select(.name == "qso-io") | .version')
          python3 .github/scripts/release_metadata.py notes "$version" "$RUNNER_TEMP/release-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check registry and GitHub release state before uploading
        env:
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          registry_status=$(curl --silent --show-error --retry 3 --output "$RUNNER_TEMP/registry-version.json" --write-out '%{http_code}' \
            --header 'User-Agent: qso-io release workflow' "https://crates.io/api/v1/crates/qso-io/$VERSION")
          case "$registry_status" in
            404) ;;
            200) echo '::error::Version already published. Inspect source identity and complete only missing release operations.'; exit 1 ;;
            *) echo "::error::Registry lookup failed: HTTP $registry_status"; exit 1 ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" > "$RUNNER_TEMP/release-tag.txt"; then
            echo "::error::Tag $TAG already exists. Inspect its target and use the recovery procedure."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Remote tag lookup failed: exit $status"
              exit "$status"
            fi
          fi

          release_status=$(curl --silent --show-error --retry 3 --output "$RUNNER_TEMP/github-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          case "$release_status" in
            404) ;;
            200) echo "::error::GitHub release $TAG already exists. Use the recovery procedure."; exit 1 ;;
            *) echo "::error::GitHub release lookup failed: HTTP $release_status"; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: registry
      - name: Publish checked package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
        run: cargo publish --locked
      - name: Tag published revision and create GitHub release
        env:
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_REVISION"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$RELEASE_REVISION" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
